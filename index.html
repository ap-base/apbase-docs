<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Documentação do APBase: geração de mapas para agricultura de precisão.">
    <title>APBase — Documentação</title>
    <script>
      const language = (navigator.languages?.[0] || navigator.language || "en")
        .toLowerCase().split("-")[0];
      const destination = new URL(
        language === "pt" ? "pt/index.html" : "en/index.html",
        window.location.href
      );
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=en/index.html">
    </noscript>
  </head>
  <body></body>
</html>
